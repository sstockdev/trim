name: trim
description: "Personal food log and weight-loss coach."
publish_to: 'none'
version: 1.2.0+8

environment:
  sdk: ^3.13.5

dependencies:
  cupertino_http: 3.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_secure_storage: ^11.2.0
  health: ^13.3.2
  http: ^1.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icons for both platforms, drawn by Resources/trim_icon.py. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: Resources/AppIcon.png
  android: true
  ios: true
  remove_alpha_ios: true
